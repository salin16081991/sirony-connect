# Host-level vhost for connect.sirony.in
#
# Install on the VPS:
#   sudo cp connect.sirony.in.conf /etc/nginx/sites-available/connect.sirony.in
#   sudo ln -s /etc/nginx/sites-available/connect.sirony.in /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d connect.sirony.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# certbot rewrites the TLS block below with the real certificate paths and
# adds the port 80 -> 443 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name connect.sirony.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name connect.sirony.in;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/connect.sirony.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/connect.sirony.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Privacy-first: do not retain per-request client IPs in host access logs.
    # Swap to a normal access_log if you need request-level debugging.
    access_log off;

    client_max_body_size 10m;

    location / {
        # Must match HOST_PORT in .env
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade, in case realtime features land later.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
