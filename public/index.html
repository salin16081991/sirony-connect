<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sirony Connect</title>
    <meta name="description" content="Privacy-first social connection platform." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Privacy-first: every asset is first-party. Loading this app contacts
         no origin other than this server. -->
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="offline-banner" class="banner" hidden>Offline — showing cached content.</div>

    <header class="app-header">
      <a class="brand" href="#/">
        <img src="/icons/icon-192.png" alt="" width="30" height="30" class="brand-mark" />
        <span class="brand-name">Sirony<span class="brand-accent">Connect</span></span>
      </a>
      <button id="install-btn" class="btn btn-ghost btn-sm" hidden>Install</button>
    </header>

    <main id="view" class="container" aria-live="polite">
      <p class="muted">Loading…</p>
    </main>

    <nav id="tabbar" class="tabbar" hidden>
      <a href="#/discover" data-tab="discover">Discover</a>
      <a href="#/matches" data-tab="matches">Matches</a>
      <a href="#/profiles" data-tab="profiles">Profiles</a>
      <a href="#/privacy" data-tab="privacy">Privacy</a>
    </nav>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="/js/app.js" type="module"></script>
  </body>
</html>
