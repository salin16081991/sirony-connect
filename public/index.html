<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch; the CSS
         puts it back with env(safe-area-inset-*). user-scalable=no is
         deliberate for an app-shell PWA, and every control meets the 48px
         touch target so pinch-zoom is not needed for legibility. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Sirony Connect</title>
    <meta name="description" content="Privacy-first social connection platform." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#17100f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fff7f3" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#/discover">
        <img src="/icons/icon-192.png" alt="" width="28" height="28" class="brand-mark" />
        <span class="brand-name">Sirony<span class="brand-accent">Connect</span></span>
      </a>
      <div class="row">
        <button id="install-btn" class="btn btn-ghost btn-sm" hidden>Install</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite">
      <p class="muted">Loading…</p>
    </main>

    <nav id="tabbar" class="tabbar" hidden>
      <a href="#/discover" data-tab="discover" aria-label="Discover">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10a4.3 4.3 0 0 1 7.5-2.9 4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10Z"/></svg>
        <span>Discover</span>
      </a>
      <a href="#/matches" data-tab="matches" aria-label="Matches">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.9 9.9 0 0 1-3.9-.8L3 21l1.9-4.6A8.3 8.3 0 0 1 3.6 11.5 8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></svg>
        <span>Matches</span>
      </a>
      <a href="#/feed" data-tab="feed" aria-label="Moments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.8 4.3 4.6.4-3.5 3 1.1 4.5L12 13.4 8 15.7l1.1-4.5-3.5-3 4.6-.4Z"/><path d="M5 20h14"/></svg>
        <span>Moments</span>
      </a>
      <a href="#/profiles" data-tab="profiles" aria-label="You">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        <span>You</span>
      </a>
    </nav>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="/js/app.js" type="module"></script>
  </body>
</html>
