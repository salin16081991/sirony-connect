<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Connect</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <h1>You're offline</h1>
        <p class="lede">
          Connect can't reach the server right now. This page was served from
          your device. It'll reconnect on its own once you're back online.
        </p>
      </section>
      <section class="card">
        <button class="btn" onclick="location.reload()">Try again</button>
      </section>
    </main>
  </body>
</html>
